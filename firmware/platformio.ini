; ==============================================================================
; Elo5System v4 — PlatformIO Configuration (Arquitetura Distribuída 2 Nós)
; Ambientes separados para porta_controller e rack-controller (Hardware e Wokwi)
; ==============================================================================

[platformio]
default_envs = porta_hardware, rack_hardware

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=1024
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    miguelbalboa/MFRC522@^1.4.11
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.11
    adafruit/RTClib@^2.1.4
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:porta_hardware]
extends = common
build_flags =
    ${common.build_flags}
    -DNODE_PORTA
    -DENV_HARDWARE_REAL

[env:porta_wokwi_sim]
extends = common
build_flags =
    ${common.build_flags}
    -DNODE_PORTA
    -DENV_WOKWI_SIM

[env:rack_hardware]
extends = common
build_flags =
    ${common.build_flags}
    -DNODE_RACK
    -DENV_HARDWARE_REAL

[env:rack_wokwi_sim]
extends = common
build_flags =
    ${common.build_flags}
    -DNODE_RACK
    -DENV_WOKWI_SIM
