[platformio]
default_envs = esp32_hardware_real

[env]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1

build_unflags =
    -std=gnu++11

[env:esp32_hardware_real]
description = Compilação para bancada/hardware real com leitor MFRC522 conectado
extends = env
lib_deps =
    ${env.lib_deps}
    miguelbalboa/MFRC522 @ ^1.4.11

[env:esp32_wokwi_sim]
description = Compilação para simulação Wokwi usando botões virtuais em GPIO 32/33
extends = env
build_flags =
    ${env.build_flags}
    -DWOKWI_NO_RC522
