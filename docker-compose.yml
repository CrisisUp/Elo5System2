services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: elo5-mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/certs:/mosquitto/config/certs:ro
      - ./mosquitto/config/pwfile:/mosquitto/config/pwfile:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h localhost -p 8883 --cafile /mosquitto/config/certs/ca.crt --cert /mosquitto/config/certs/client.crt --key /mosquitto/config/certs/client.key -u \"$$MQTT_HEALTH_USER\" -P \"$$MQTT_HEALTH_PASS\" -t 'elo5/healthcheck' -m 'ping' || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      MQTT_HEALTH_USER: "${MQTT_HEALTH_USER:-healthcheck}"
      MQTT_HEALTH_PASS: "${MQTT_HEALTH_PASS:-SenhaForteHealth123}"
    networks:
      - elo5-net

  elo5api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: elo5-api
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_BROKER: "mosquitto"
      MQTT_PORT: "8883"
      MQTT_TOPIC_WILDCARD: "elo5/#"
      MQTT_TLS_ENABLED: "true"
      MQTT_CA_CERT: "/app/certs/ca.crt"
      MQTT_CLIENT_CERT: "/app/certs/api.crt"
      MQTT_CLIENT_KEY: "/app/certs/api.key"
      MQTT_USERNAME: "${MQTT_API_USER:-elo5api}"
      MQTT_PASSWORD: "${MQTT_API_PASSWORD:-SenhaForteApi123}"
      DATABASE_URL: "sqlite:////data/elo5system.db"
      API_ADMIN_KEY: "${API_ADMIN_KEY:-}"
    ports:
      - "8000:8000"
    volumes:
      - elo5_data:/data
      - ./mosquitto/config/certs:/app/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - elo5-net

  elo5-sim:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: elo5-sim
    profiles:
      - sim
    restart: "no"
    depends_on:
      mosquitto:
        condition: service_healthy
      elo5api:
        condition: service_healthy
    environment:
      MQTT_BROKER: "mosquitto"
      MQTT_PORT: "8883"
      MQTT_TLS_ENABLED: "true"
      MQTT_CA_CERT: "/app/certs/ca.crt"
      MQTT_CLIENT_CERT: "/app/certs/sim.crt"
      MQTT_CLIENT_KEY: "/app/certs/sim.key"
      MQTT_USERNAME: "${MQTT_SIM_USER:-elo5sim}"
      MQTT_PASSWORD: "${MQTT_SIM_PASSWORD:-SenhaForteSim123}"
    volumes:
      - ./mosquitto/config/certs:/app/certs:ro
    command: ["--uid", "04A1B2C3D4", "--delay", "1"]
    networks:
      - elo5-net

volumes:
  mosquitto_data:
  mosquitto_log:
  elo5_data:

networks:
  elo5-net:
    driver: bridge
